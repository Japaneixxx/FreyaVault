<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f1115">
    <meta name="description" content="Freya — suas finanças, no seu navegador.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <title>Freya</title>
    <style>
        :root { color-scheme: dark; }
        html, body { height: 100%; margin: 0; background: #0f1115; overflow: hidden; }
        #root { height: 100%; width: 100%; }
        .boot {
            position: fixed; inset: 0; display: grid; place-items: center;
            pointer-events: none;
            color: #cfd6e4; font: 600 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
            letter-spacing: .12em; text-transform: uppercase;
        }
    </style>
</head>
<body>
<div id="root"><div class="boot">Carregando Freya…</div></div>
<script src="freya.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('sw.js').catch(function () { /* offline opcional */ });
        });
    }
</script>
</body>
</html>
