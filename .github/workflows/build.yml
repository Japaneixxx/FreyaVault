name: Build and Release APK & Web

on:
  push:
    branches:
      - main
      - master
      - BetaWeb
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Build e Release oficial do APK (roda APENAS na main/master)
  build-android-release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "Missing required GitHub Secret: $secret" >&2
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/freya-release.keystore"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/freya-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Read app version
        id: app-version
        shell: bash
        run: |
          version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "versionName must follow Major.Minor.Bug (for example, 1.2.0)" >&2
            exit 1
          fi
          # Beta: o último número da versão (Bug) tem 2 ou mais dígitos (ex.: 1.8.41); com 1 dígito é estável
          bug="${version_name##*.}"
          prerelease=false
          if [[ ${#bug} -ge 2 ]]; then prerelease=true; fi
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Build web (PWA/Wasm) distribution
        run: gradle :app:wasmJsBrowserDistribution --no-daemon

      - name: Generate APK checksum
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Freya-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Pack web distribution
        run: |
          cd app/build/dist/wasmJs/productionExecutable
          zip -qr "$GITHUB_WORKSPACE/freya-web.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: Freya-web
          path: freya-web.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app-version.outputs.name }}
          name: Freya v${{ steps.app-version.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.app-version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
            freya-web.zip

  # 2. Build Web (WasmJS), copia o proxy da API do Pluggy e faz Deploy na Vercel
  deploy-web-vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build web (PWA/Wasm) distribution
        run: gradle :app:wasmJsBrowserDistribution --no-daemon

      - name: Prepare Vercel API proxy
        run: |
          mkdir -p app/build/dist/wasmJs/productionExecutable/api/pluggy
          cat << 'EOF' > "app/build/dist/wasmJs/productionExecutable/api/pluggy/[...path].js"
          export default async function handler(req, res) {
            const pathSegments = req.query.path || [];
            const path = Array.isArray(pathSegments) ? pathSegments.join("/") : pathSegments;

            const queryIndex = req.url.indexOf("?");
            const queryString = queryIndex !== -1 ? req.url.slice(queryIndex) : "";
            const targetUrl = `https://api.pluggy.ai/${path}${queryString}`;

            const headers = {
              Accept: "application/json",
            };
            if (req.headers["content-type"]) headers["Content-Type"] = req.headers["content-type"];
            if (req.headers["x-api-key"]) headers["X-API-KEY"] = req.headers["x-api-key"];

            const init = {
              method: req.method,
              headers,
            };

            if (req.method !== "GET" && req.method !== "HEAD" && req.body) {
              init.body = typeof req.body === "string" ? req.body : JSON.stringify(req.body);
            }

            try {
              const upstream = await fetch(targetUrl, init);
              const text = await upstream.text();
              res.status(upstream.status);
              res.setHeader("Content-Type", upstream.headers.get("content-type") || "application/json");
              return res.send(text);
            } catch (err) {
              return res.status(502).json({ error: String(err) });
            }
          }
          EOF

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/master" ]; then
            vercel deploy app/build/dist/wasmJs/productionExecutable --prod --yes --token=$VERCEL_TOKEN
          else
            vercel deploy app/build/dist/wasmJs/productionExecutable --yes --token=$VERCEL_TOKEN
          fi
